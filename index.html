<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>M &amp; S Loads LLC | MS Express</title>
<meta name="description" content="M &amp; S Loads LLC operates MS Express, a reefer trucking company in Hastings, Nebraska.">
<link rel="icon" href="ms-express-logo.png">
<style>
:root {
  --navy: #0b1f33;
  --red: #c8102e;
  --offwhite: #f4f6f8;
  --ink: #1c2430;
  --muted: #5a6573;
  --line: #dce1e7;
  --white: #ffffff;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: Inter, "Segoe UI", Helvetica, Arial, sans-serif;
  color: var(--ink);
  background: var(--offwhite);
  line-height: 1.6;
}
a { color: var(--red); }
.wrap { max-width: 720px; margin: 0 auto; padding: 0 24px; }
.site-header {
  background: var(--white);
  border-bottom: 1px solid var(--line);
}
.site-header .bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  min-height: 76px;
  gap: 16px;
}
.logo img { height: 40px; width: auto; display: block; }
.nav-main a {
  color: var(--navy);
  text-decoration: none;
  font-size: 14px;
  font-weight: 600;
  padding: 8px 10px;
}
.nav-main a:hover,
.nav-main a[aria-current="page"] { color: var(--red); }
main { padding: 40px 0 64px; }
h1 {
  margin: 0 0 16px;
  color: var(--navy);
  font-size: 28px;
  font-weight: 700;
}
.who p { margin: 0 0 14px; }
.who p:last-child { margin-bottom: 0; }
.office { margin-top: 28px; color: var(--muted); }
.office p { margin: 0 0 8px; }
.site-footer {
  background: var(--navy);
  color: #c5ced8;
  padding: 22px 0;
  font-size: 14px;
}
.site-footer .bar {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
}
.site-footer a { color: #e8eef6; text-decoration: none; }
.site-footer p { margin: 0; }
@media (max-width: 640px) {
  .logo img { height: 32px; }
  h1 { font-size: 24px; }
}
</style>
</head>
<body>
<header class="site-header">
  <div class="wrap bar">
    <a class="logo" href="/"><img src="ms-express-logo.png" alt="MS Express"></a>
    <nav class="nav-main">
      <a href="/" aria-current="page">Home</a>
      <a href="/privacy.html">Privacy</a>
      <a href="/messaging.html">Messaging terms</a>
    </nav>
  </div>
</header>
<main>
  <div class="wrap who">
    <h1>Who we are</h1>
    <p>M &amp; S Loads LLC operates MS Express, a reefer trucking company in Hastings, Nebraska. We haul temperature-controlled freight.</p>
    <p>Office: 600 E 39th St, Hastings, NE 68901<br>
    <a href="mailto:info@msloads.com">info@msloads.com</a> · 402-302-0097</p>
  </div>
</main>
<footer class="site-footer">
  <div class="wrap bar">
    <nav>
      <a href="/privacy.html">Privacy</a>
      <a href="/messaging.html">Messaging terms</a>
    </nav>
    <p>© 2026 M &amp; S Loads LLC</p>
  </div>
</footer>
</body>
</html>
